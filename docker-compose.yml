# Secret (self-hosted) — App + Caddy-Reverse-Proxy mit automatischem HTTPS.
# Start:  cp .env.example .env  &&  docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/secrets.db
      MAX_TTL: "${MAX_TTL:-604800}"
      ALLOW_SERVER_ENCRYPT: "${ALLOW_SERVER_ENCRYPT:-false}"
      API_TOKEN: "${API_TOKEN:-}"
      BASE_URL: "${BASE_URL:-}"
    volumes:
      - secrets-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  secrets-data:
  caddy-data:
  caddy-config:
